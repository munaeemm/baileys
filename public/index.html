<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baileys Manager</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 20px; color: #fff; }
    .add-form { display: flex; gap: 10px; margin-bottom: 24px; }
    .add-form input { flex: 1; padding: 10px 14px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 0.95rem; }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn-green { background: #25d366; color: #000; }
    .btn-red { background: #e53e3e; color: #fff; }
    .btn-blue { background: #3182ce; color: #fff; }
    .btn:hover { opacity: 0.85; }
    .sessions { display: grid; gap: 14px; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 18px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-name { font-size: 1rem; font-weight: 700; color: #fff; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; }
    .badge-connected { background: #1a4731; color: #25d366; }
    .badge-qr { background: #4a3600; color: #f6ad55; }
    .badge-connecting, .badge-reconnecting { background: #1a2a4a; color: #63b3ed; }
    .badge-logged_out, .badge-stopped, .badge-disconnected { background: #2a1a1a; color: #fc8181; }
    .card-actions { display: flex; gap: 8px; }
    .qr-wrap { margin-top: 12px; text-align: center; }
    .qr-wrap img { border-radius: 8px; border: 4px solid #fff; max-width: 220px; }
    .qr-wrap p { margin-top: 8px; font-size: 0.82rem; color: #aaa; }
    .send-form { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .send-form input { flex: 1; min-width: 140px; padding: 8px 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 0.88rem; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: #000; padding: 12px 20px; border-radius: 10px; font-weight: 700; display: none; z-index: 999; }
  </style>
</head>
<body>
  <h1>📱 Baileys Manager</h1>

  <div class="add-form">
    <input id="newId" placeholder="Session name e.g. gcprints-main" />
    <button class="btn btn-green" onclick="addSession()">+ Add Number</button>
  </div>

  <div class="sessions" id="sessions"></div>
  <div class="toast" id="toast"></div>

  <script>
    const socket = io();
    let sessions = [];

    async function loadSessions() {
      const res = await fetch('/api/sessions');
      sessions = await res.json();
      render();
    }

    function render() {
      const el = document.getElementById('sessions');
      if (!sessions.length) { el.innerHTML = '<p style="color:#666">No sessions yet. Add a number above.</p>'; return; }
      el.innerHTML = sessions.map(s => `
        <div class="card" id="card-${s.id}">
          <div class="card-header">
            <span class="card-name">${s.id}</span>
            <span class="badge badge-${s.status}" id="badge-${s.id}">${s.status}</span>
          </div>
          <div class="card-actions">
            <button class="btn btn-blue" onclick="restart('${s.id}')">🔄 Restart</button>
            <button class="btn btn-red" onclick="deleteSession('${s.id}')">🗑 Delete</button>
          </div>
          ${s.qr ? `<div class="qr-wrap"><img src="${s.qr}" /><p>Scan with WhatsApp to connect</p></div>` : ''}
          ${s.status === 'connected' ? `
          <div class="send-form">
            <input id="num-${s.id}" placeholder="Number e.g. 447911123456" />
            <input id="msg-${s.id}" placeholder="Message" />
            <button class="btn btn-green" onclick="send('${s.id}')">Send</button>
          </div>` : ''}
        </div>
      `).join('');
    }

    socket.on('status', ({ sessionId, status }) => {
      const s = sessions.find(x => x.id === sessionId);
      if (s) { s.status = status; if (status !== 'qr') s.qr = null; }
      const badge = document.getElementById('badge-' + sessionId);
      if (badge) { badge.className = `badge badge-${status}`; badge.textContent = status; }
      if (status === 'connected' || status === 'logged_out') render();
    });

    socket.on('qr', ({ sessionId, qr }) => {
      const s = sessions.find(x => x.id === sessionId);
      if (s) { s.qr = qr; s.status = 'qr'; }
      render();
    });

    async function addSession() {
      const id = document.getElementById('newId').value.trim();
      if (!id) return;
      await fetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
      document.getElementById('newId').value = '';
      await loadSessions();
    }

    async function deleteSession(id) {
      if (!confirm(`Delete session "${id}"?`)) return;
      await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
      sessions = sessions.filter(s => s.id !== id);
      render();
    }

    async function restart(id) {
      await fetch(`/api/sessions/${id}/restart`, { method: 'POST' });
      toast('Restarting...');
    }

    async function send(id) {
      const number = document.getElementById('num-' + id).value.trim();
      const message = document.getElementById('msg-' + id).value.trim();
      if (!number || !message) return;
      const res = await fetch(`/api/sessions/${id}/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ number, message }) });
      const data = await res.json();
      toast(data.ok ? '✅ Sent!' : '❌ ' + data.error);
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    loadSessions();
  </script>
</body>
</html>
